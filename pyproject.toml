[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leolm"
version = "0.1.0"
requires-python = ">=3.11,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/deployment"]
markers = [
  "hardware: requires real audio hardware and is excluded from the default suite",
]

[tool.setuptools.packages.find]
where = ["src"]
